name: Genome experiment
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/genome-experiment.yml'
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python prepare_data.py --output data/ecoli.fna
      - run: python train.py --fasta data/ecoli.fna --hidden 64 --heads 4 --layers 2 --vocab-size 256 --window 256 --batch-size 16 --epochs 3 --max-batches 64 --output outputs/ecoli-small
      - uses: actions/upload-artifact@v4
        with:
          name: ecoli-small-experiment
          path: |
            outputs/ecoli-small/
            data/ecoli.source.json
